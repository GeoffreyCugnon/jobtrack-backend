stages:
  - build
  - deploy

variables:
  AWS_DEFAULT_REGION: eu-west-3
  ECR_REGISTRY: '<AWS_ACCOUNT_ID>.dkr.ecr.eu-west-3.amazonaws.com'
  ECR_REPOSITORY: 'jobtrack-backend'
  IMAGE_TAG: '$CI_COMMIT_SHORT_SHA'
  DEPLOY_PATH: '/opt/jobtrack/backend'

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    # N'installe aucun AWS CLI sur l'hôte Alpine du job (musl) : 3 approches
    # différentes (apk aws-cli, pip awscli, binaire officiel + gcompat) ont
    # toutes échoué sur cette même incompatibilité glibc/musl. À la place,
    # on récupère le token ECR en lançant l'image AWS CLI officielle via le
    # daemon dind déjà utilisé juste après pour build/push — aucun souci de
    # compat puisqu'elle tourne dans son propre conteneur (glibc).
    # Trim défensif : un espace/saut de ligne parasite dans la variable GitLab
    # (copier-coller depuis la console AWS) suffit à faire échouer la
    # signature SigV4 avec InvalidSignatureException.
    - export AWS_ACCESS_KEY_ID="$(printf '%s' "$GITLAB_AWS_ACCESS_KEY_ID" | tr -d '[:space:]')"
    - export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$GITLAB_AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')"
    # Le pull anonyme depuis public.ecr.aws peut être throttlé par intermittence
    # (IP de runner partagée) -> retry avec backoff avant de lancer le conteneur.
    - |
      for i in 1 2 3 4 5; do
        docker pull public.ecr.aws/aws-cli/aws-cli && break
        echo "docker pull public.ecr.aws/aws-cli/aws-cli a échoué (tentative $i/5), retry dans $((i*5))s..."
        sleep $((i*5))
      done
    - >
      docker run --rm
      -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION"
      public.ecr.aws/aws-cli/aws-cli ecr get-login-password --region "$AWS_DEFAULT_REGION"
      | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  script:
    - docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
    - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # SSH_PRIVATE_KEY est une variable GitLab de type File (niveau groupe) :
    # sa valeur est un CHEMIN vers un fichier contenant la clé, pas la clé
    # elle-même — d'où l'échec des tentatives précédentes qui traitaient
    # $SSH_PRIVATE_KEY comme du texte à écrire (elles écrivaient le chemin).
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    # docker-compose.yml suit le même cycle de vie que le code applicatif
    # (contrairement à infra/docker-compose.yml, géré à part) : la CI le
    # resynchronise à chaque déploiement plutôt que de compter sur un dépôt
    # manuel qu'on oublierait de refaire au prochain changement.
    - scp docker-compose.yml "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/docker-compose.yml"
    - >
      ssh "$EC2_USER@$EC2_HOST"
      "cd $DEPLOY_PATH &&
      export ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG=$IMAGE_TAG &&
      docker compose pull &&
      docker compose up -d &&
      docker image prune -f"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
